# Render Blueprint for the Provenyx API (free plan): New → Blueprint → select this repository.
# You are asked for the values marked `sync: false`; everything else is preset. See deploy.md.
services:
  - type: web
    name: provenyx-api # gives https://provenyx-api.onrender.com, the frontend's default proxy target
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: behind Render's and Vercel's proxies, rate limits must see the real client address.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Your Vercel URL, e.g. https://provenyx.vercel.app. The GitHub callback URL, CORS origin and
      # secure cookies are derived from it.
      - key: PROVENYX_FRONTEND_URL
        sync: false
      # From your GitHub OAuth App (deploy.md step 3). Can be added after the first deploy.
      - key: PROVENYX_GITHUB_CLIENT_ID
        sync: false
      - key: PROVENYX_GITHUB_CLIENT_SECRET
        sync: false
      # Optional but recommended: a free Neon Postgres URL. Empty = SQLite, wiped on every restart.
      - key: PROVENYX_DATABASE_URL
        sync: false
      - key: PROVENYX_GITHUB_SESSION_SECRET
        generateValue: true
      # Copy this value into Vercel as PROVENYX_API_KEY (server-side; never shipped to browsers).
      - key: PROVENYX_API_KEY
        generateValue: true
